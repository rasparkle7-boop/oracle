name: Wake ORACLE for scheduled refresh

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: oracle-scheduled-refresh
  cancel-in-progress: false

jobs:
  wake-api:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the Render API and scheduler
        run: curl --fail --retry 3 --retry-delay 5 --retry-all-errors --max-time 120 https://oracle-api-k6xr.onrender.com/api/health
