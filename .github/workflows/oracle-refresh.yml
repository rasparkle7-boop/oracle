name: Refresh ORACLE predictions

on:
  schedule:
    - cron: "15,45 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: oracle-scheduled-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Trigger and monitor the ORACLE sync
        env:
          ORACLE_API: https://oracle-api-k6xr.onrender.com
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from datetime import datetime, timezone
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = os.environ["ORACLE_API"]

          def call(path, method="GET"):
              attempts = 5 if method == "GET" else 1
              for attempt in range(attempts):
                  try:
                      request = Request(base + path, method=method)
                      with urlopen(request, timeout=60) as response:
                          return json.load(response)
                  except HTTPError as exc:
                      if method != "GET" or (exc.code < 500 and exc.code != 429) or attempt == attempts - 1:
                          raise
                  except (TimeoutError, URLError):
                      if method != "GET" or attempt == attempts - 1:
                          raise
                  time.sleep(min(20, 5 * (attempt + 1)))

          def latest_sync():
              scheduler = call("/api/automation").get("scheduler", {})
              return scheduler.get("last_sync") or {}

          before = latest_sync()
          before_at = before.get("at")
          if before_at:
              try:
                  age = (datetime.now(timezone.utc) - datetime.fromisoformat(before_at.replace("Z", "+00:00"))).total_seconds()
                  if age < 20 * 60:
                      print(f"Recent sync already completed ({int(age)}s ago); skipping duplicate.")
                      raise SystemExit(0)
              except ValueError:
                  pass

          queued = call("/api/sync", "POST")
          job_id = queued.get("job_id")
          if not job_id:
              raise RuntimeError(f"Sync was not queued: {queued}")

          deadline = time.monotonic() + 90 * 60
          while time.monotonic() < deadline:
              job = call("/api/jobs/" + job_id)
              if job.get("status") == "completed":
                  print(f"Sync completed: {job.get('message', 'ok')}")
                  raise SystemExit(0)
              if job.get("status") == "failed":
                  message = job.get("message", "")
                  if "already running" not in message.lower():
                      raise RuntimeError(f"Sync failed: {message}")
                  current = latest_sync().get("at")
                  if current and current != before_at:
                      print("The already-running scheduled sync completed successfully.")
                      raise SystemExit(0)
              time.sleep(60)

          raise TimeoutError("ORACLE sync did not finish within 90 minutes")
          PY
