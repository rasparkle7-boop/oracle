
services:
  - type: web
    name: oracle-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn oracle.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: oracle-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: ORACLE_DATA_DIR
        value: /opt/render/project/src/data
      - key: ORACLE_SCHEDULER
        value: "1"
